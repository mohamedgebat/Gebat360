<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_gebat_official.png" />
    <link rel="shortcut icon" type="image/png" href="/logo_gebat_official.png" />
    <link rel="apple-touch-icon" href="/logo_gebat_official.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GEBAT 360" />
    <meta name="application-name" content="GEBAT 360°" />
    <meta name="description" content="Système d'exploitation et de pilotage financier & technique des chantiers BTP GEBAT SA" />
    <title>GEBAT 360° — BTP Construction Operating System</title>
    <script>
      (function() {
        // Intercepteur d'erreur inline d'urgence pour purger le cache et recharger la page automatiquement
        window.addEventListener('error', function(e) {
          var target = e.target || {};
          var src = String(target.src || e.message || '');
          if (src.includes('index-') || src.includes('.js') || e.message.indexOf('Failed to load module script') !== -1 || e.message.indexOf('text/html') !== -1) {
            console.warn('⚡ [GEBAT 360°] Ancien hash de build détecté. Rechargement propre...');
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(reg) { reg.unregister(); });
              });
            }
            setTimeout(function() {
              window.location.reload();
            }, 200);
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
