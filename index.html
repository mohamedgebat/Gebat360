<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_gebat_official.png" />
    <link rel="shortcut icon" type="image/png" href="/logo_gebat_official.png" />
    <link rel="apple-touch-icon" href="/logo_gebat_official.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GEBAT 360" />
    <meta name="application-name" content="GEBAT 360°" />
    <meta name="description" content="Système d'exploitation et de pilotage financier & technique des chantiers BTP GEBAT SA" />
    <title>GEBAT 360° — BTP Construction Operating System</title>
    <script>
      (function() {
        function purgeAndHardReload(reason) {
          var now = Date.now();
          var lastReload = Number(sessionStorage.getItem('gebat_last_purge') || 0);
          if (now - lastReload < 4000) {
            return;
          }
          sessionStorage.setItem('gebat_last_purge', String(now));
          console.warn('⚡ [GEBAT 360°] Auto-purge SW & cache client suite à:', reason);
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(reg) { reg.unregister(); });
            });
          }
          setTimeout(function() {
            var freshUrl = window.location.origin + window.location.pathname + '?_v=' + now;
            window.location.replace(freshUrl);
          }, 150);
        }

        window.addEventListener('error', function(e) {
          var target = e.target || {};
          var src = String(target.src || '');
          var msg = String(e.message || '');
          if (
            msg.indexOf('Failed to load module script') !== -1 ||
            msg.indexOf('text/html') !== -1 ||
            src.indexOf('.js') !== -1 ||
            src.indexOf('index-') !== -1
          ) {
            purgeAndHardReload(msg || src);
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = String(e.reason || '');
          if (
            reason.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            reason.indexOf('text/html') !== -1 ||
            reason.indexOf('Importing a module script failed') !== -1
          ) {
            purgeAndHardReload(reason);
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
