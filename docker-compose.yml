version: '3.8'

services:
  # 1. Base de données MySQL 8.0 pour GEBAT 360° ERP
  mysql:
    image: mysql:8.0
    container_name: gebat_mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gebat_360_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # 2. Serveur Backend API Express / TypeScript
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gebat_api_container
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "mysql://root:root@mysql:3306/gebat_360_db"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: gebat_360_db
    depends_on:
      - mysql

  # 3. Application Frontend React NGINX Web
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gebat_web_container
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mysql_data:
